import com.vanniktech.maven.publish.SonatypeHost

plugins {
	id 'java-library'
	id "com.vanniktech.maven.publish" version "0.28.0"
	id 'signing'
	id 'org.springframework.boot' version '3.3.6'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'io.github.soyesenna'
version = '0.0.1-beta'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenLocal()
	mavenCentral()
}

tasks.withType(Javadoc) {
	options {
		encoding 'UTF-8'
	}
}

signing {
	sign publishing.publications
}

mavenPublishing {
	signAllPublications()
	publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

	coordinates("io.github.soyesenna", "temporal-sage", "0.0.1-beta")

	pom {
		name = 'temporal-sage'
		description = 'Simple SAGA pattern implementation library using Temporal for Spring'
		url = 'https://github.com/soyesenna/TemporalSage.git'

		licenses {
			license {
				name = 'Apache License'
				url = 'https://github.com/soyesenna/TemporalSage/blob/main/LICENSE'
			}
		}

		developers {
			developer {
				id = 'soyesenna'
				name = 'Jooyoung Kim'
				email = 'kjy915875@gmail.com'
			}
		}

		scm {
			connection = 'scm:git:github.com/soyesenna/TemporalSage.git'
			developerConnection = 'scm:git:ssh://github.com:soyesenna/TemporalSage.git'
			url = 'https://github.com/soyesenna/TemporalSage/tree/main'
		}
	}
}

dependencies {
	api 'org.springframework.boot:spring-boot-autoconfigure'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	
	// Temporal SDK
	api 'io.temporal:temporal-sdk:1.17.0'

	api 'com.google.auto.service:auto-service:1.0.1'
	annotationProcessor 'com.google.auto.service:auto-service:1.0.1'

	api 'com.squareup:javapoet:1.13.0'
	api 'com.github.javaparser:javaparser-core:3.26.3'
	api "com.github.javaparser:javaparser-symbol-solver-core:3.26.3"

	api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

bootJar {
	enabled = false
}

jar {
	enabled = true
}

test {
	useJUnitPlatform()
}
